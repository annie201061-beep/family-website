<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyrus 的成长小树 🌳</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cream: '#fef9ef',
        warmgreen: '#bbf7d0',
        softgreen: '#86efac',
        sage: '#dcfce7',
        gold: '#fde68a',
        peach: '#fed7aa',
        coral: '#fdba74',
        lavender: '#e9d5ff',
        sky: '#bae6fd',
        warmgray: '#f5f0eb',
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
* { font-family: 'Noto Sans SC', sans-serif; }

.grow-enter { animation: growIn 0.5s ease forwards; }
@keyframes growIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.float { animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
input[type="date"] { color-scheme: light; }
</style>
</head>
<body class="bg-cream min-h-screen">

<header class="sticky top-0 z-50 bg-cream/90 backdrop-blur-sm border-b border-peach/30 px-4 py-3">
  <div class="max-w-lg mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-3xl float">🌳</span>
      <div>
        <h1 class="text-lg font-bold text-gray-800 leading-tight">Cyrus 的成长小树</h1>
        <p class="text-xs text-gray-500" id="todayDate"></p>
      </div>
    </div>
  </div>
</header>

<main class="max-w-lg mx-auto px-4 py-4 pb-24">

  <!-- ==================== TODAY ==================== -->
  <section class="tab-content grow-enter">

    <!-- Today's Activities -->
    <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-peach/20">
      <h2 class="text-base font-bold text-gray-800 mb-3">🌟 今日活动</h2>
      <p class="text-xs text-gray-500 mb-4">勾选今天做过的事情~</p>

      <div class="space-y-3">
        <div class="flex items-start gap-3 p-3 bg-peach/20 rounded-xl">
          <input type="checkbox" id="act1" class="task-check mt-1 w-5 h-5 rounded accent-coral cursor-pointer" onchange="updateProgress()">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg">📚</span>
              <label for="act1" class="text-sm font-medium text-gray-800 cursor-pointer">亲子阅读</label>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">中文或英文绘本，一起读30分钟</p>
          </div>
        </div>

        <div class="flex items-start gap-3 p-3 bg-lavender/20 rounded-xl">
          <input type="checkbox" id="act2" class="task-check mt-1 w-5 h-5 rounded accent-lavender cursor-pointer" onchange="updateProgress()">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg">🎵</span>
              <label for="act2" class="text-sm font-medium text-gray-800 cursor-pointer">听儿歌/唱歌</label>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">英文儿歌或中文童谣，一起唱</p>
          </div>
        </div>

        <div class="flex items-start gap-3 p-3 bg-sky/20 rounded-xl">
          <input type="checkbox" id="act3" class="task-check mt-1 w-5 h-5 rounded accent-sky cursor-pointer" onchange="updateProgress()">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg">🧮</span>
              <label for="act3" class="text-sm font-medium text-gray-800 cursor-pointer">数学小游戏</label>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">数数、认形状、分类游戏</p>
          </div>
        </div>

        <div class="flex items-start gap-3 p-3 bg-warmgreen/20 rounded-xl">
          <input type="checkbox" id="act4" class="task-check mt-1 w-5 h-5 rounded accent-softgreen cursor-pointer" onchange="updateProgress()">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg">🎨</span>
              <label for="act4" class="text-sm font-medium text-gray-800 cursor-pointer">创意玩耍</label>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">画画、积木、手工或自由玩耍</p>
          </div>
        </div>

        <div class="flex items-start gap-3 p-3 bg-gold/20 rounded-xl">
          <input type="checkbox" id="act5" class="task-check mt-1 w-5 h-5 rounded accent-gold cursor-pointer" onchange="updateProgress()">
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-lg">🏃</span>
              <label for="act5" class="text-sm font-medium text-gray-800 cursor-pointer">户外活动</label>
            </div>
            <p class="text-xs text-gray-500 mt-0.5">公园、散步、跑步、玩耍</p>
          </div>
        </div>
      </div>

      <!-- Progress -->
      <div class="mt-4 pt-3 border-t border-gray-100">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-gray-500">今日进度</span>
          <span class="text-xs font-bold text-gray-700" id="progressText">0 / 5</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-2.5">
          <div id="progressBar" class="bg-coral h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Mood -->
    <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-peach/20">
      <h2 class="text-base font-bold text-gray-800 mb-3">💝 今日心情</h2>
      <p class="text-xs text-gray-500 mb-3">今天开心吗？</p>
      <div class="flex justify-between gap-2" id="moodSelector">
        <button onclick="selectMood(1)" class="mood-btn flex-1 py-2 rounded-xl text-2xl hover:scale-110 transition-transform" data-mood="1" title="不开心">😢</button>
        <button onclick="selectMood(2)" class="mood-btn flex-1 py-2 rounded-xl text-2xl hover:scale-110 transition-transform" data-mood="2" title="有点无聊">😶</button>
        <button onclick="selectMood(3)" class="mood-btn flex-1 py-2 rounded-xl text-2xl hover:scale-110 transition-transform bg-gold/30" data-mood="3" title="开心">😊</button>
        <button onclick="selectMood(4)" class="mood-btn flex-1 py-2 rounded-xl text-2xl hover:scale-110 transition-transform" data-mood="4" title="好开心！">😆</button>
        <button onclick="selectMood(5)" class="mood-btn flex-1 py-2 rounded-xl text-2xl hover:scale-110 transition-transform" data-mood="5" title="超级开心！">🥰</button>
      </div>
      <p class="text-xs text-gray-400 mt-2 text-center" id="moodLabel">今天开心</p>
    </div>

    <!-- Milestone -->
    <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-peach/20">
      <h2 class="text-base font-bold text-gray-800 mb-2">🏆 今日新本领</h2>
      <p class="text-xs text-gray-500 mb-3">今天学会了什么新东西？</p>
      <textarea id="milestone" class="w-full p-3 bg-peach/10 rounded-xl text-sm text-gray-700 resize-none focus:outline-none focus:ring-2 focus:ring-peach/50" rows="2" placeholder="比如：认识了新颜色 / 说了新单词 / 自己穿上了鞋子"></textarea>
      <button onclick="saveMilestone()" class="mt-2 px-4 py-1.5 bg-coral text-white text-sm font-medium rounded-full hover:bg-coral/80 transition-colors">保存 ✨</button>
    </div>

    <button onclick="saveToday()" class="w-full py-3 bg-coral text-white font-bold rounded-2xl shadow-sm hover:bg-coral/90 transition-colors mb-4">
      保存今日记录 📝
    </button>
    <p id="saveConfirm" class="text-center text-sm text-coral font-medium mb-4 hidden">✓ 已保存！Cyrus 今天又长大了一点~</p>
  </section>

  <!-- ==================== MILESTONES ==================== -->
  <section class="tab-content section-hidden grow-enter">
    <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-peach/20">
      <h2 class="text-lg font-bold text-gray-800 mb-1">🏆 成长里程碑</h2>
      <p class="text-xs text-gray-500 mb-4">Cyrus 的成长记录</p>

      <div id="milestoneList" class="space-y-3">
        <div class="text-center text-sm text-gray-400 py-4">还没有里程碑记录</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-peach/20">
      <h3 class="text-base font-bold text-gray-800 mb-3">📋 发育 Checklist</h3>
      <p class="text-xs text-gray-500 mb-3">3岁幼儿参考标准</p>
      <div id="checklist" class="space-y-2">
        <p class="text-sm text-gray-500">加载中...</p>
      </div>
    </div>
  </section>

</main>

<script>
// ==================== DATA ====================
const STORAGE_KEY = 'cyrus_data';
const CHECKLIST_KEY = 'cyrus_checklist';

const defaultChecklist = [
  '能说出完整的句子（3-5个字）',
  '能认识至少5种颜色',
  '能数到10',
  '能自己穿简单的鞋子',
  '能交替脚上楼',
  '能骑三轮车',
  '能自己用勺子吃饭',
  '能区分你我他',
  '能说出自己的全名',
  '能认识常见动物叫声',
  '能跟着音乐跳舞',
  '能自己上厕所（小便）',
  '能和别的小朋友一起玩',
  '能听故事并回答问题',
  '能认至少10个英文字母',
];

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch {}
  }
  return { dailyRecords: {}, milestones: [], settings: {} };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let appData = loadData();

// ==================== DATE ====================
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

// ==================== MOOD ====================
const moodLabels = { 1: '不开心', 2: '有点无聊', 3: '开心', 4: '好开心！', 5: '超级开心！' };
const moodEmoji = { 1: '😢', 2: '😶', 3: '😊', 4: '😆', 5: '🥰' };

function selectMood(level) {
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.remove('bg-gold/30', 'bg-peach/30', 'bg-softgreen/30');
    if (parseInt(b.dataset.mood) === level) {
      b.classList.add('bg-gold/30');
    }
  });
  document.getElementById('moodLabel').textContent = moodLabels[level] || '';
  appData.settings.mood = level;
}

// ==================== PROGRESS ====================
function updateProgress() {
  const checks = ['act1','act2','act3','act4','act5'];
  const done = checks.filter(id => document.getElementById(id).checked).length;
  document.getElementById('progressText').textContent = done + ' / 5';
  document.getElementById('progressBar').style.width = (done / 5 * 100) + '%';
}

// ==================== MILESTONE ====================
function saveMilestone() {
  const text = document.getElementById('milestone').value.trim();
  if (!text) return;
  appData.milestones.unshift({ date: getTodayKey(), text });
  if (appData.milestones.length > 50) appData.milestones.pop();
  saveData(appData);
  document.getElementById('milestone').value = '';
  renderMilestones();
}

function renderMilestones() {
  const el = document.getElementById('milestoneList');
  if (appData.milestones.length === 0) {
    el.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">还没有里程碑记录</div>';
    return;
  }
  el.innerHTML = appData.milestones.map(m =>
    `<div class="bg-peach/10 rounded-xl p-3">
      <p class="text-sm text-gray-700">${m.text}</p>
      <p class="text-xs text-gray-400 mt-1">${m.date}</p>
    </div>`
  ).join('');
}

// ==================== CHECKLIST ====================
function renderChecklist() {
  const saved = localStorage.getItem(CHECKLIST_KEY);
  const doneItems = saved ? JSON.parse(saved) : [];
  const el = document.getElementById('checklist');
  el.innerHTML = defaultChecklist.map((item, i) => {
    const checked = doneItems.includes(i);
    return `<label class="flex items-center gap-3 cursor-pointer p-2 rounded-lg hover:bg-gray-50">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCheck(${i})" class="w-4 h-4 rounded accent-coral">
      <span class="text-sm text-gray-700 ${checked ? 'line-through text-gray-400' : ''}">${item}</span>
    </label>`;
  }).join('');
}

function toggleCheck(index) {
  let doneItems = [];
  try { doneItems = JSON.parse(localStorage.getItem(CHECKLIST_KEY) || '[]'); } catch {}
  if (doneItems.includes(index)) {
    doneItems = doneItems.filter(i => i !== index);
  } else {
    doneItems.push(index);
  }
  localStorage.setItem(CHECKLIST_KEY, JSON.stringify(doneItems));
  renderChecklist();
}

// ==================== SAVE ====================
function saveToday() {
  const key = getTodayKey();
  appData.dailyRecords[key] = {
    tasks: ['act1','act2','act3','act4','act5'].filter(id => document.getElementById(id).checked).length,
    mood: appData.settings.mood || 3,
    milestone: document.getElementById('milestone').value.trim(),
  };
  saveData(appData);
  document.getElementById('saveConfirm').classList.remove('hidden');
  setTimeout(() => document.getElementById('saveConfirm').classList.add('hidden'), 3000);
}

// ==================== INIT ====================
function init() {
  renderMilestones();
  renderChecklist();
  selectMood(appData.settings.mood || 3);

  const key = getTodayKey();
  if (appData.dailyRecords[key]) {
    const rec = appData.dailyRecords[key];
    if (rec.tasks >= 1) {
      ['act1','act2','act3','act4','act5'].forEach((id, i) => {
        if (i < rec.tasks) document.getElementById(id).checked = true;
      });
      updateProgress();
    }
    if (rec.milestone) document.getElementById('milestone').value = rec.milestone;
  }
}

init();
</script>

</body>
</html>
